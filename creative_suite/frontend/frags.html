<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PANTHEON — Frag Control Room</title>
<style>
:root {
  --bg: #0e0e10;
  --bg-panel: #17171a;
  --bg-row: #1c1c20;
  --bg-row-hover: #26262c;
  --border: #2c2c33;
  --text: #c9c9ce;
  --text-dim: #7d7d86;
  --silver: #b8b8c0;
  --gold: #d4af37;
  --green: #4caf7d;
  --red: #c05050;
  --amber: #c9a227;
  --blue: #5a8fc0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", system-ui, sans-serif;
  font-size: 13px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
button { font-family: inherit; }
header {
  padding: 8px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: baseline;
  gap: 12px;
  background: var(--bg-panel);
}
header h1 { font-size: 15px; letter-spacing: 3px; color: var(--silver); font-weight: 600; }
header h1 span { color: var(--gold); }
header .count { color: var(--text-dim); font-size: 12px; }
#filters {
  display: flex; flex-wrap: wrap; gap: 8px;
  padding: 6px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-panel);
  align-items: center;
}
#filters label {
  display: flex; align-items: center; gap: 5px;
  color: var(--text-dim); font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.5px;
}
#filters input, #filters select {
  background: var(--bg); color: var(--text);
  border: 1px solid var(--border); border-radius: 3px;
  padding: 3px 6px; font-size: 12px;
}
#filters input:focus, #filters select:focus { outline: 1px solid var(--gold); }
#filters input[type="number"] { width: 60px; }
#filters input[type="text"] { width: 140px; }
#filters button.apply {
  background: var(--gold); color: #111; border: none; border-radius: 3px;
  padding: 4px 14px; font-weight: 600; cursor: pointer; font-size: 12px;
}
main { flex: 1; display: grid; grid-template-columns: 320px 1fr 340px; min-height: 0; }

/* ---- left: frag list ---- */
#list-col { display: flex; flex-direction: column; border-right: 1px solid var(--border); min-height: 0; }
#list-scroll { flex: 1; overflow-y: auto; }
.frag-row {
  padding: 5px 10px; border-bottom: 1px solid #202024;
  cursor: pointer; background: var(--bg-row);
  display: flex; flex-direction: column; gap: 2px;
}
.frag-row:nth-child(even) { background: var(--bg); }
.frag-row:hover { background: var(--bg-row-hover); }
.frag-row.selected { outline: 1px solid var(--gold); outline-offset: -1px; }
.frag-row .line1 { display: flex; gap: 8px; align-items: baseline; }
.frag-row .score { color: var(--gold); font-weight: 700; min-width: 38px; }
.frag-row .weapon { color: var(--silver); font-size: 11px; }
.frag-row .demo-short {
  color: var(--text-dim); font-size: 10px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.frag-row .line2 { display: flex; gap: 3px; flex-wrap: wrap; align-items: center; }
.chip {
  display: inline-block; background: #26262c; border: 1px solid var(--border);
  border-radius: 8px; padding: 0 6px; font-size: 10px; color: var(--silver);
}
.badge {
  display: inline-block; border-radius: 3px; padding: 0 5px;
  font-size: 10px; font-weight: 700;
}
.badge.qa-PASS, .badge.qa-PASSED, .badge.qa-APPROVED { background: #1d3a2a; color: var(--green); }
.badge.qa-PENDING { background: #3a331d; color: var(--amber); }
.badge.qa-FAIL, .badge.qa-FAILED, .badge.qa-REJECTED { background: #3a1d1d; color: var(--red); }
.badge.qa-other { background: #26262c; color: var(--text-dim); }
.badge.verdict-LOVE { background: #3a1d33; color: #e08fd0; }
.badge.verdict-KEEP { background: #1d3a2a; color: var(--green); }
.badge.verdict-MAYBE { background: #3a331d; color: var(--amber); }
.badge.verdict-DROP { background: #3a1d1d; color: var(--red); }
#pager {
  display: flex; align-items: center; gap: 8px; justify-content: center;
  padding: 6px; border-top: 1px solid var(--border); background: var(--bg-panel);
}
#pager button {
  background: #26262c; color: var(--silver); border: 1px solid var(--border);
  border-radius: 3px; padding: 3px 12px; cursor: pointer;
}
#pager button:disabled { opacity: 0.4; cursor: default; }
#pager span { color: var(--text-dim); font-size: 11px; }

/* ---- center: player ---- */
#player-col { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #0a0a0c; }
#video-wrap {
  flex: 1; display: flex; align-items: center; justify-content: center;
  min-height: 0; position: relative;
}
#player { max-width: 100%; max-height: 100%; background: #000; }
#video-placeholder { color: var(--text-dim); text-align: center; padding: 20px; }
#video-placeholder .big { font-size: 15px; color: var(--silver); margin-bottom: 8px; }
#event-strip {
  height: 34px; margin: 0 12px; position: relative;
  background: var(--bg-panel); border: 1px solid var(--border); border-radius: 3px;
}
#event-strip .marker {
  position: absolute; top: 0; bottom: 0; width: 2px; background: var(--gold);
}
#event-strip .marker.offset { background: var(--blue); }
#event-strip .playhead {
  position: absolute; top: 0; bottom: 0; width: 1px; background: #fff; opacity: 0.8;
}
#event-strip .loop-zone {
  position: absolute; top: 0; bottom: 0; background: rgba(212,175,55,0.15);
}
#transport {
  display: flex; align-items: center; gap: 6px; padding: 8px 12px; flex-wrap: wrap;
}
#transport button {
  background: #26262c; color: var(--silver); border: 1px solid var(--border);
  border-radius: 3px; padding: 4px 10px; cursor: pointer; font-size: 12px;
}
#transport button:hover { border-color: var(--gold); }
#transport button.active { background: var(--gold); color: #111; font-weight: 700; }
#transport select {
  background: var(--bg); color: var(--text); border: 1px solid var(--border);
  border-radius: 3px; padding: 3px 5px; font-size: 12px;
}
#transport .tc { color: var(--text-dim); font-size: 11px; margin-left: auto; font-variant-numeric: tabular-nums; }
.hotkey-hint { color: var(--text-dim); font-size: 10px; padding: 0 12px 6px; }

/* ---- right: inspector ---- */
#inspector { border-left: 1px solid var(--border); background: var(--bg-panel); overflow-y: auto; padding: 12px 14px; }
#inspector h2 { font-size: 13px; color: var(--gold); margin-bottom: 6px; letter-spacing: 1px; }
#inspector h3 {
  font-size: 10px; color: var(--text-dim); text-transform: uppercase;
  letter-spacing: 1px; margin: 12px 0 4px;
}
#inspector .empty { color: var(--text-dim); padding: 30px 0; text-align: center; }
.evidence { margin-bottom: 6px; padding: 5px 7px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; }
.evidence .ev-head { display: flex; gap: 6px; align-items: baseline; }
.evidence .ev-name { color: var(--silver); font-weight: 600; font-size: 12px; }
.evidence .ev-conf { font-size: 10px; color: var(--amber); }
.evidence .ev-detail { color: var(--text-dim); font-size: 11px; margin-top: 2px; }
.evidence .ev-metrics { color: var(--gold); font-size: 11px; margin-top: 2px; font-variant-numeric: tabular-nums; }
pre {
  background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
  padding: 6px; font-size: 10px; overflow-x: auto; white-space: pre-wrap;
  word-break: break-all; color: var(--silver); max-height: 180px; overflow-y: auto;
}
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 1px 10px; font-size: 11px; }
.kv .k { color: var(--text-dim); }
.kv .v { color: var(--silver); word-break: break-all; }
.verdict-btns { display: flex; gap: 4px; }
.verdict-btns button, .tier-btns button {
  flex: 1; background: #26262c; color: var(--silver); border: 1px solid var(--border);
  border-radius: 3px; padding: 6px 0; cursor: pointer; font-size: 11px; font-weight: 700;
}
.verdict-btns button.on-LOVE { background: #3a1d33; color: #e08fd0; border-color: #e08fd0; }
.verdict-btns button.on-KEEP { background: #1d3a2a; color: var(--green); border-color: var(--green); }
.verdict-btns button.on-MAYBE { background: #3a331d; color: var(--amber); border-color: var(--amber); }
.verdict-btns button.on-DROP { background: #3a1d1d; color: var(--red); border-color: var(--red); }
.tier-btns { display: flex; gap: 4px; margin-top: 6px; }
.tier-btns button.on { background: var(--gold); color: #111; border-color: var(--gold); }
#notes {
  width: 100%; min-height: 56px; background: var(--bg); color: var(--text);
  border: 1px solid var(--border); border-radius: 3px; padding: 5px;
  font-size: 12px; font-family: inherit; resize: vertical;
}
#notes:focus { outline: 1px solid var(--gold); }
.save-state { font-size: 10px; color: var(--text-dim); height: 12px; }
#proxy-box { margin-top: 4px; }
#proxy-state { font-size: 11px; }
#proxy-state .st-READY { color: var(--green); font-weight: 700; }
#proxy-state .st-FAILED { color: var(--red); font-weight: 700; }
#proxy-state .st-QUEUED, #proxy-state .st-GENERATING { color: var(--amber); font-weight: 700; }
#proxy-state .st-MISSING { color: var(--text-dim); }
#btn-proxy {
  margin-top: 5px; width: 100%; background: var(--gold); color: #111;
  border: none; border-radius: 3px; padding: 6px 0; font-weight: 700;
  cursor: pointer; font-size: 12px;
}
#btn-proxy:disabled { opacity: 0.45; cursor: default; }
.path-row { display: flex; gap: 6px; align-items: center; margin-top: 5px; }
.path-row code {
  flex: 1; font-size: 10px; color: var(--text-dim);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.path-row button {
  background: #26262c; color: var(--silver); border: 1px solid var(--border);
  border-radius: 3px; padding: 2px 8px; cursor: pointer; font-size: 10px;
}
.hint { color: var(--amber); font-size: 11px; margin-top: 5px; }
</style>
</head>
<body>
<header>
  <h1>PANTHE<span>O</span>N &middot; FRAG CONTROL ROOM</h1>
  <span class="count" id="total-count">loading…</span>
</header>

<div id="filters">
  <label>Min score <input type="number" id="f-min-score" step="1" placeholder="0"></label>
  <label>Weapon <select id="f-weapon"><option value="">all</option></select></label>
  <label>Class <select id="f-class"><option value="">all</option></select></label>
  <label>Demo <input type="text" id="f-demo" placeholder="substring…"></label>
  <label>Pool
    <select id="f-pool">
      <option value="MAIN_CA" selected>MAIN_CA</option>
      <option value="SIDE_DUEL">SIDE_DUEL</option>
      <option value="SIDE_OTHER">SIDE_OTHER</option>
      <option value="all">all</option>
    </select>
  </label>
  <label><input type="checkbox" id="f-master"> has master</label>
  <label>Sort
    <select id="f-sort">
      <option value="score" selected>score desc</option>
      <option value="time">time</option>
    </select>
  </label>
  <button class="apply" id="btn-apply">APPLY</button>
</div>

<main>
  <div id="list-col">
    <div id="list-scroll"></div>
    <div id="pager">
      <button id="pg-prev">&larr;</button>
      <span id="pg-label">–</span>
      <button id="pg-next">&rarr;</button>
    </div>
  </div>

  <div id="player-col">
    <div id="video-wrap">
      <video id="player" hidden></video>
      <div id="video-placeholder">
        <div class="big">No playable video</div>
        <div>Select a frag, then generate a review capture.</div>
      </div>
    </div>
    <div id="event-strip"></div>
    <div id="transport">
      <button id="btn-play">Play</button>
      <button id="btn-step-back" title="frame back (,)">&#x2039; fr</button>
      <button id="btn-step-fwd" title="frame fwd (.)">fr &#x203A;</button>
      <select id="rate-sel" title="playback rate">
        <option value="0.25">0.25&times;</option>
        <option value="0.35">0.35&times;</option>
        <option value="0.5">0.5&times;</option>
        <option value="0.75">0.75&times;</option>
        <option value="1" selected>1&times;</option>
        <option value="1.5">1.5&times;</option>
        <option value="2">2&times;</option>
      </select>
      <button id="btn-loop-in" title="[">Loop IN</button>
      <button id="btn-loop-out" title="]">Loop OUT</button>
      <button id="btn-loop-clear" title="L">Clear loop</button>
      <span class="tc" id="timecode">0.000 / 0.000</span>
    </div>
    <div class="hotkey-hint">space play · , . frame-step · [ ] loop marks · L clear loop</div>
  </div>

  <div id="inspector">
    <div class="empty">Select a frag to inspect its recognition evidence.</div>
  </div>
</main>

<script src="/static/frags.js"></script>
</body>
</html>
